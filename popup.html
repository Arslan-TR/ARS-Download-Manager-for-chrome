<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ARS Download Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="toolbar">
    <button type="button" id="addBtn" class="tb primary" data-i18n-title="addDownload">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
    </button>
    <button type="button" id="resumeBtn" class="tb" data-i18n-title="resumeSelected">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10-6.5a1 1 0 0 0 0-1.72l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>
    </button>
    <button type="button" id="pauseBtn" class="tb" data-i18n-title="pauseSelected">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <button type="button" id="removeBtn" class="tb" data-i18n-title="removeSelected">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4zM6 9h12l-1 11a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2zm4 2v8h1.5v-8zm2.5 0v8H14v-8z"/></svg>
    </button>
    <button type="button" id="folderBtn" class="tb" data-i18n-title="openFolder">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zm2 4v8h14v-8z"/></svg>
    </button>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
      <input type="search" id="search" data-i18n-placeholder="search" data-i18n-aria="search">
    </label>
    <button type="button" id="menuBtn" class="tb" data-i18n-title="limitSettings" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
    </button>
  </header>

  <form class="add" id="addForm" hidden novalidate>
    <input type="url" id="addUrl" data-i18n-placeholder="urlPlaceholder" data-i18n-aria="urlPlaceholder">
    <button type="submit" class="btn primary" data-i18n="download"></button>
    <button type="button" class="tb small" id="addClose" data-i18n-title="close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.7 5.3 12 10.6l5.3-5.3 1.4 1.4-5.3 5.3 5.3 5.3-1.4 1.4-5.3-5.3-5.3 5.3-1.4-1.4 5.3-5.3-5.3-5.3z"/></svg>
    </button>
  </form>
  <p class="error add-error" id="addError" hidden data-i18n="invalidUrl"></p>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <div class="list-head">
    <input type="checkbox" id="selectAll" data-i18n-aria="selectAll" data-i18n-title="selectAll">
    <span class="col-name" data-i18n="colName"></span>
    <span class="col-size" data-i18n="colSize"></span>
  </div>

  <main class="list-wrap">
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden data-i18n="emptyList"></p>
  </main>

  <section class="settings" id="settings" hidden>
    <div class="row">
      <span class="label strong" data-i18n="limiterLabel"></span>
      <label class="switch" data-i18n-title="toggleLabel">
        <input type="checkbox" id="enabled" data-i18n-aria="toggleLabel">
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <span class="label" data-i18n="limitValue"></span>
      <div class="limit-input">
        <input type="number" id="limit" min="0" step="any" inputmode="decimal" data-i18n-aria="limitValue">
        <select id="unit">
          <option value="KBps">KB/s</option>
          <option value="MBps">MB/s</option>
          <option value="Mbps">Mbps</option>
        </select>
      </div>
    </div>
    <p class="error" id="limitError" hidden data-i18n="invalidLimit"></p>
    <div class="presets" role="group" data-i18n-aria="presetsLabel">
      <button type="button" class="chip" data-preset="1">1 MB/s</button>
      <button type="button" class="chip" data-preset="2">2 MB/s</button>
      <button type="button" class="chip" data-preset="5">5 MB/s</button>
      <button type="button" class="chip" data-preset="10">10 MB/s</button>
    </div>
    <div class="row">
      <span class="label" data-i18n="modeLabel"></span>
      <div class="segmented" role="radiogroup">
        <button type="button" role="radio" data-mode="share" data-i18n="modeShare" data-i18n-title="modeShareHint"></button>
        <button type="button" role="radio" data-mode="sequential" data-i18n="modeSequential" data-i18n-title="modeSequentialHint"></button>
      </div>
    </div>
  </section>

  <footer class="statusbar">
    <button type="button" class="snail" id="snail" aria-pressed="false" data-i18n-title="toggleLabel">
      <svg viewBox="0 0 32 24" aria-hidden="true">
        <path d="M13 5a7.5 7.5 0 0 1 7.5 7.5c0 1.1-.2 2.1-.7 3h5.4l1.6-2.8.2-4.4a1.5 1.5 0 1 1 1.6-.2l-.2 4.9-2.3 4.1a2 2 0 0 1-1.7 1H4.5A1.5 1.5 0 0 1 3 16.6a10.5 10.5 0 0 1 3.1-7.3A7.5 7.5 0 0 1 13 5zm0 3a4.5 4.5 0 0 0-4.5 4.5 2.5 2.5 0 0 0 5 0h-2a.5.5 0 0 1-1 0 2.5 2.5 0 0 1 5 0 4.5 4.5 0 0 1-.4 1.9l1.8.9a6.5 6.5 0 0 0 .6-2.8A4.5 4.5 0 0 0 13 8z"/>
      </svg>
      <span id="snailLabel"></span>
    </button>
    <span class="speed-total" data-i18n-title="speedNowHint">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4h2v11.2l4.3-4.3 1.4 1.4L12 19l-6.7-6.7 1.4-1.4 4.3 4.3z"/></svg>
      <strong id="speedNow"></strong>
      <span class="avg" id="speedAvg"></span>
    </span>
    <button type="button" class="tb small chev" id="settingsBtn" data-i18n-title="limitSettings" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 8 6.7 6.7-1.4 1.4L12 10.8l-5.3 5.3-1.4-1.4z"/></svg>
    </button>
  </footer>

  <template id="itemTpl">
    <li class="item">
      <div class="row-main">
        <input type="checkbox" class="sel">
        <button type="button" class="act">
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10-6.5a1 1 0 0 0 0-1.72l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>
          <svg class="i-folder" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <svg class="i-retry" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.6 4.7l1.9.6A5 5 0 1 0 12 7v3L7.5 6 12 2z"/></svg>
        </button>
        <span class="ftype"></span>
        <div class="main">
          <span class="name"></span>
          <span class="sub">
            <span class="badge"></span>
            <span class="speed"></span>
            <span class="eta"></span>
            <span class="host"></span>
          </span>
        </div>
        <div class="size">
          <span class="size-text"></span>
          <div class="bar"><div class="fill"></div></div>
        </div>
      </div>
      <div class="details" hidden>
        <span class="url"></span>
        <label class="perfile">
          <span class="perfile-label"></span>
          <input type="number" min="0" step="any" inputmode="decimal" class="perfile-input">
          <span class="perfile-unit"></span>
        </label>
      </div>
    </li>
  </template>

  <script type="module" src="popup.js"></script>
</body>
</html>
