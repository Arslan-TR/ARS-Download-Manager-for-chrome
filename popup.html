<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ARS Download Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="toolbar">
    <button type="button" id="addBtn" class="btn-new" data-i18n-title="addDownload">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
      <span data-i18n="newShort"></span>
    </button>
    <button type="button" id="resumeBtn" class="tb" data-i18n-title="resumeSelected">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10-6.5a1 1 0 0 0 0-1.72l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>
    </button>
    <button type="button" id="pauseBtn" class="tb" data-i18n-title="pauseSelected">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <button type="button" id="removeBtn" class="tb" data-i18n-title="removeSelected">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4zM6 9h12l-1 11a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2zm4 2v8h1.5v-8zm2.5 0v8H14v-8z"/></svg>
    </button>
    <button type="button" id="folderBtn" class="tb" data-i18n-title="openFolder">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zm2 4v8h14v-8z"/></svg>
    </button>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
      <input type="search" id="search" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="search">
    </label>
    <div class="view-toggle" role="group">
      <button type="button" data-view="list" aria-pressed="true" data-i18n-title="viewList">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
      </button>
      <button type="button" data-view="grid" aria-pressed="false" data-i18n-title="viewGrid">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zm2 2v3h3V6zm7-2h7v7h-7zm2 2v3h3V6zM4 13h7v7H4zm2 2v3h3v-3zm7-2h7v7h-7zm2 2v3h3v-3z"/></svg>
      </button>
    </div>
  </header>

  <form class="add" id="addForm" hidden novalidate>
    <input type="url" id="addUrl" data-i18n-placeholder="urlPlaceholder" data-i18n-aria="urlPlaceholder">
    <button type="submit" class="btn primary" data-i18n="download"></button>
    <button type="button" class="tb small" id="addClose" data-i18n-title="close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.7 5.3 12 10.6l5.3-5.3 1.4 1.4-5.3 5.3 5.3 5.3-1.4 1.4-5.3-5.3-5.3 5.3-1.4-1.4 5.3-5.3-5.3-5.3z"/></svg>
    </button>
  </form>
  <p class="error add-error" id="addError" hidden data-i18n="invalidUrl"></p>

  <nav class="tabs-row">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="filter">
      <button type="button" class="tab filter-btn" id="filterBtn" aria-haspopup="menu" aria-expanded="false" data-i18n-title="moreFilters">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5z"/></svg>
        <span id="filterLabel"></span>
        <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5z"/></svg>
      </button>
      <div class="menu" id="filterMenu" role="menu" hidden></div>
    </div>
  </nav>

  <div class="list-head">
    <input type="checkbox" id="selectAll" data-i18n-aria="selectAll" data-i18n-title="selectAll">
    <button type="button" class="sort col-name" data-sort="name" data-i18n-title="sortName">
      <span data-i18n="colName"></span><span class="arrows" aria-hidden="true"><b>↑</b><b>↓</b></span>
    </button>
    <button type="button" class="sort col-size" data-sort="size" data-i18n-title="sortSize">
      <span data-i18n="colSize"></span><span class="arrows" aria-hidden="true"><b>↑</b><b>↓</b></span>
    </button>
  </div>

  <main class="list-wrap">
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden data-i18n="emptyList"></p>
  </main>

  <section class="limitbar" id="limitbar">
    <div class="lb-toggle">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a10 10 0 0 1 8.7 15H18.3a8 8 0 1 0-12.6 0H3.3A10 10 0 0 1 12 4zm4.2 4.4 1.4 1.4-4.2 4.6a1.9 1.9 0 1 1-1.4-1.4z"/></svg>
      <span data-i18n="limiterLabel"></span>
      <label class="switch" data-i18n-title="toggleLabel">
        <input type="checkbox" id="enabled" data-i18n-aria="toggleLabel">
        <span class="slider"></span>
      </label>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <div class="lb-limit">
      <span class="label" data-i18n="limitColon"></span>
      <div class="limit-input">
        <input type="number" id="limit" min="0" step="any" inputmode="decimal" data-i18n-aria="limitValue">
        <select id="unit" data-i18n-aria="limitValue">
          <option value="KBps">KB/s</option>
          <option value="MBps">MB/s</option>
          <option value="Mbps">Mbps</option>
        </select>
      </div>
    </div>
    <div class="presets" role="group" data-i18n-aria="presetsLabel">
      <button type="button" class="chip" data-preset="1" title="1 MB/s">1</button>
      <button type="button" class="chip" data-preset="2" title="2 MB/s">2</button>
      <button type="button" class="chip" data-preset="5" title="5 MB/s">5</button>
      <button type="button" class="chip" data-preset="10" title="10 MB/s">10</button>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <div class="lb-mode">
      <span class="label" data-i18n="modeColon"></span>
      <div class="segmented" role="radiogroup">
        <button type="button" role="radio" data-mode="share" data-i18n="modeShare" data-i18n-title="modeShareHint"></button>
        <button type="button" role="radio" data-mode="sequential" data-i18n="modeSequential" data-i18n-title="modeSequentialHint"></button>
      </div>
    </div>
  </section>
  <p class="error limit-error" id="limitError" hidden data-i18n="invalidLimit"></p>

  <footer class="statusbar">
    <button type="button" class="snail" id="snail" aria-pressed="false" data-i18n-title="toggleLabel">
      <svg viewBox="0 0 32 24" aria-hidden="true">
        <path d="M13 5a7.5 7.5 0 0 1 7.5 7.5c0 1.1-.2 2.1-.7 3h5.4l1.6-2.8.2-4.4a1.5 1.5 0 1 1 1.6-.2l-.2 4.9-2.3 4.1a2 2 0 0 1-1.7 1H4.5A1.5 1.5 0 0 1 3 16.6a10.5 10.5 0 0 1 3.1-7.3A7.5 7.5 0 0 1 13 5zm0 3a4.5 4.5 0 0 0-4.5 4.5 2.5 2.5 0 0 0 5 0h-2a.5.5 0 0 1-1 0 2.5 2.5 0 0 1 5 0 4.5 4.5 0 0 1-.4 1.9l1.8.9a6.5 6.5 0 0 0 .6-2.8A4.5 4.5 0 0 0 13 8z"/>
      </svg>
      <span id="snailLabel"></span>
    </button>
    <span class="speed-total" data-i18n-title="speedNowHint">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4h2v11.2l4.3-4.3 1.4 1.4L12 19l-6.7-6.7 1.4-1.4 4.3 4.3z"/></svg>
      <strong id="speedNow"></strong>
      <span class="avg" id="speedAvg"></span>
    </span>
    <span class="toast" id="toast" role="status" hidden></span>
  </footer>

  <div class="menu row-menu" id="rowMenu" role="menu" hidden>
    <button type="button" role="menuitem" data-action="limit" data-i18n="fileLimitMenu"></button>
    <button type="button" role="menuitem" data-action="copy" data-i18n="copyLink"></button>
    <button type="button" role="menuitem" data-action="redownload" data-i18n="redownload"></button>
    <button type="button" role="menuitem" data-action="cancel" data-i18n="cancelDownload"></button>
    <button type="button" role="menuitem" data-action="remove" class="danger" data-i18n="removeFromList"></button>
  </div>

  <template id="itemTpl">
    <li class="item">
      <div class="row-main">
        <input type="checkbox" class="sel">
        <span class="status-icon" aria-hidden="true">
          <svg class="s-folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <svg class="s-down" viewBox="0 0 24 24"><path d="M11 4h2v11.2l4.3-4.3 1.4 1.4L12 19l-6.7-6.7 1.4-1.4 4.3 4.3z"/></svg>
          <svg class="s-paused" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          <svg class="s-failed" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm-1 5v7h2V7zm0 9v2h2v-2z"/></svg>
          <svg class="s-canceled" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm-3.5 5L7 8.5 10.5 12 7 15.5 8.5 17l3.5-3.5 3.5 3.5 1.5-1.5-3.5-3.5L17 8.5 15.5 7 12 10.5z"/></svg>
        </span>
        <span class="ftype"></span>
        <div class="main">
          <span class="name"></span>
          <span class="sub">
            <span class="badge"></span>
            <span class="speed"></span>
            <span class="eta"></span>
            <span class="host"></span>
          </span>
        </div>
        <div class="size">
          <span class="size-text"></span>
          <div class="bar"><div class="fill"></div></div>
        </div>
        <div class="actions">
          <button type="button" class="act primary-act">
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10-6.5a1 1 0 0 0 0-1.72l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
            <svg class="i-retry" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.6 4.7l1.9.6A5 5 0 1 0 12 7v3L7.5 6 12 2z"/></svg>
          </button>
          <button type="button" class="act folder-act">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zm2 4v8h14v-8z"/></svg>
          </button>
          <button type="button" class="act more-act" aria-haspopup="menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          </button>
        </div>
      </div>
      <div class="details" hidden>
        <span class="url"></span>
        <label class="perfile">
          <span class="perfile-label"></span>
          <input type="number" min="0" step="any" inputmode="decimal" class="perfile-input">
          <span class="perfile-unit"></span>
        </label>
      </div>
    </li>
  </template>

  <script type="module" src="popup.js"></script>
</body>
</html>
