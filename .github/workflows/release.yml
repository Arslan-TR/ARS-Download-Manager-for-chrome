# Pushing a tag like v0.26.1 builds ARS-Download-Manager-v.0.26.1.zip and
# publishes it as a GitHub release. The tag must match manifest.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}" >&2
            exit 1
          fi

      - name: Unit tests
        run: npm test

      - name: Build zip
        id: build
        run: echo "zip=$(scripts/build-zip.sh)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          **Download:** \`$(basename "${{ steps.build.outputs.zip }}")\` below (under **Assets**).

          📘 Installation guide: [English](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/INSTALL.md) · 🇹🇷 [Türkçe](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/KURULUM.md)
          EOF
          gh release create "${GITHUB_REF_NAME}" "${{ steps.build.outputs.zip }}" \
            --title "ARS Download Manager ${GITHUB_REF_NAME}" \
            --notes-file notes.md
