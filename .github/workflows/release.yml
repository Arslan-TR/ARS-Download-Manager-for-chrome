# Publishes ARS-Download-Manager-v.<version>.zip as a GitHub release, tagged
# v<version> from manifest.json. Runs on a pushed v* tag (which must match the
# manifest) or manually ("Run workflow"), which creates the tag itself.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Work out tag from manifest version
        id: tag
        run: |
          tag="v$(node -p "require('./manifest.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version (${tag})" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: npm test

      - name: Build zip
        id: build
        run: echo "zip=$(scripts/build-zip.sh)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          cat > notes.md <<EOF
          **Download:** \`$(basename "${ZIP}")\` below (under **Assets**).

          📘 Installation guide: [English](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/INSTALL.md) · 🇹🇷 [Türkçe](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/KURULUM.md)
          EOF
          gh release create "${TAG}" "${ZIP}" \
            --target "${GITHUB_SHA}" \
            --title "ARS Download Manager ${TAG}" \
            --notes-file notes.md
